name: appimage

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "trajinspector/**", ".github/workflows/appimage.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for QtWebEngine (offscreen)
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libopengl0 libxkbcommon0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libdbus-1-3 libfontconfig1
      - run: packaging/fetch_ngl.sh
      - run: pip install -e ".[test]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    runs-on: ubuntu-22.04   # native glibc 2.35: the oldest system the AppImage promises to run on
    permissions:
      contents: write       # attach the release assets
    steps:
      - uses: actions/checkout@v4
      - name: AppDir (fails if any ELF file needs glibc > 2.35)
        run: packaging/build_appdir.sh
      - name: AppImage (static type-2 runtime)
        run: packaging/make_appimage.sh
      - name: Self-check of the built AppDir and AppImage (offscreen)
        run: |
          build/AppDir/AppRun --self-check
          build/TrajInspector-x86_64.AppImage --appimage-extract-and-run --self-check
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: TrajInspector
          path: |
            build/TrajInspector-x86_64.AppImage
            build/TrajInspector-x86_64.tar.gz
      - name: Attach to the release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes
          build/TrajInspector-x86_64.AppImage build/TrajInspector-x86_64.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
